<{% url 'ajouter_rdv' %}>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Le Conseil Juridique{% endblock %}</title>
    {% load static %}
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; background-color: #FDFBF7; }
        
        /* --- MENU DE GAUCHE (Bordeaux) --- */
        .sidebar {
            width: 250px;
            background-color: #6B1D2F; /* Bordeaux */
            color: white;
            display: flex;
            flex-direction: column;
            padding-top: 20px;
        }
        .sidebar h2 { text-align: center; font-size: 20px; margin-bottom: 30px; }
        .sidebar a {
            color: white; text-decoration: none; padding: 15px 20px;
            display: block; border-left: 4px solid transparent;
        }
        .sidebar a:hover, .sidebar a.active {
            background-color: #4A1320; border-left: 4px solid #F4D0D8; /* Rose clair */
        }
        
        /* --- CONTENU PRINCIPAL --- */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header h1 { color: #6B1D2F; margin: 0; }
        .user-info { font-size: 14px; color: #666; }
        
        /* --- CARTES DE STATS --- */
        .cards-container { display: flex; gap: 20px; margin-bottom: 30px; }
        .card {
            background: white; padding: 20px; border-radius: 8px; flex: 1;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-top: 4px solid #6B1D2F;
        }
        .card h3 { margin: 0 0 10px 0; color: #666; font-size: 14px; text-transform: uppercase; }
        .card .number { font-size: 32px; font-weight: bold; color: #333; }
    </style>
</head>
<body>

    <!-- MENU DE GAUCHE -->
    <div class="sidebar">
        <h2> Conseil Juridique</h2>
        <a href="{% url 'dashboard' %}" class="active">Tableau de bord</a>
        <a href="{% url 'beneficiaires' %}">Bénéficiaires</a>
        <a href="{% url 'cas_juridiques' %}">Cas juridiques</a>
        <a href="{% url 'agendas' %}" class="active">Agenda</a>
        <a href="{% url 'partenaires' %}">Partenaires</a>
        <div style="margin-top: auto; padding: 20px;">
            <a href="{% url 'login' %}" style="background: #4A1320; text-align: center; border-radius: 5px;">Déconnexion</a>
        </div>
    </div>

    <!-- ZONE DE CONTENU (qui change selon la page) -->
    <div class="main-content">
        {% block content %}
        <!-- Le contenu des autres pages viendra ici -->
        {% endblock %}
    </div>

</body>
</html>
