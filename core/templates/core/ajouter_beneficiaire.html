{% extends 'core/base.html' %}

{% block title %}Ajouter un bénéficiaire - Le Conseil Juridique{% endblock %}

{% block content %}
    <div class="header">
        <h1>Nouveau Bénéficiaire</h1>
        <a href="{% url 'beneficiaires' %}" style="color: #6B1D2F; text-decoration: none;">← Retour à la liste</a>
    </div>

    <div class="card" style="width: 100%; max-width: 600px;">
        <form method="POST">
            {% csrf_token %}
            
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Nom *</label>
                <input type="text" name="nom" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Prénom *</label>
                <input type="text" name="prenom" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Téléphone *</label>
                <input type="text" name="telephone" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Zone *</label>
                <input type="text" name="zone" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Adresse (facultatif)</label>
                <input type="text" name="adresse" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
            </div>

            <button type="submit" style="background-color: #6B1D2F; color: white; padding: 12px 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%;">
                Enregistrer le bénéficiaire
            </button>
        </form>
    </div>
{% endblock %}
