<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Le Conseil Juridique</title>
    {% load static %}
    <style>
        body {
            background-color: #FDFBF7; /* Beige clair */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo {
            max-width: 200px; 
            height: auto;
            margin-bottom: 20px;
        }
        h2 {
            color: #6B1D2F; /* Bordeaux */
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            color: #333;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #6B1D2F; /* Bordeaux */
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #4A1320;
        }
        .error-message {
            color: red; 
            margin-bottom: 15px; 
            font-weight: bold;
            background-color: #f8d7da;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="{% static 'images/logo.png' %}" alt="Logo de l'ONG Centre l'Espoir" class="logo">
        
        <h2>Le Conseil Juridique</h2>
        
        <!-- Affichage des messages d'erreur -->
        {% if messages %}
            {% for message in messages %}
                <div class="error-message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %} 
            <div class="form-group">
                <label for="email">Adresse email</label>
                <input type="text" id="email" name="email" placeholder="votre@email.com" required>
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" placeholder="********" required>
            </div>
            <button type="submit">Se connecter</button>
                    <p style="margin-top: 20px; font-size: 14px;">
            Pas encore de compte ? <a href="{% url 'inscription' %}" style="color: #6B1D2F; font-weight: bold; text-decoration: none;">S'inscrire</a>
        </p>
        </form>
    </div>
</body>
</html>
