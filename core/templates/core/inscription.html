<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Le Conseil Juridique</title>
    {% load static %}
    <style>
        body {
            background-color: #FDFBF7; font-family: 'Segoe UI', sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0;
        }
        .login-card {
            background: white; padding: 40px; border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center;
        }
        .logo { max-width: 150px; height: auto; margin-bottom: 20px; }
        h2 { color: #6B1D2F; margin-bottom: 30px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; color: #333; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button {
            width: 100%; padding: 12px; background-color: #6B1D2F; color: white;
            border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px;
        }
        button:hover { background-color: #4A1320; }
        .error-message { color: red; background-color: #f8d7da; padding: 10px; border-radius: 5px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="{% static 'images/logo.png' %}" alt="Logo" class="logo">
        <h2>Créer un compte</h2>
        
        {% if messages %}
            {% for message in messages %}
                <div class="error-message">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Nom d'utilisateur</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>Adresse email</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" name="password" required>
            </div>
            <div class="form-group">
                <label>Confirmer le mot de passe</label>
                <input type="password" name="password_confirm" required>
            </div>
            <button type="submit">S'inscrire</button>
        </form>
        
        <p style="margin-top: 20px; font-size: 14px;">
            Déjà un compte ? <a href="{% url 'login' %}" style="color: #6B1D2F;">Se connecter</a>
        </p>
    </div>
</body>
</html>
