{% extends 'core/base.html' %}

{% block title %}Ajouter un partenaire - Le Conseil Juridique{% endblock %}

{% block content %}
    <div class="header">
        <h1>Ajouter un partenaire</h1>
        <a href="{% url 'partenaires' %}" style="color: #6B1D2F; text-decoration: none;">← Retour à l'annuaire</a>
    </div>

    <div class="card" style="width: 100%; max-width: 600px;">
        <form method="POST">
            {% csrf_token %}
            
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Nom de l'organisation / de l'avocat *</label>
                <input type="text" name="nom" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Type *</label>
                <select name="type_partenaire" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                    <option value="AVOCAT">Avocat</option>
                    <option value="ASSOCIATION">Association</option>
                    <option value="INSTITUTION">Institution</option>
                </select>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Téléphone *</label>
                <input type="text" name="telephone" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Email (facultatif)</label>
                <input type="email" name="email" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Adresse (facultatif)</label>
                <textarea name="adresse" rows="3" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;"></textarea>
            </div>

            <button type="submit" style="background-color: #6B1D2F; color: white; padding: 12px 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%;">
                Enregistrer le partenaire
            </button>
        </form>
    </div>
{% endblock %}
