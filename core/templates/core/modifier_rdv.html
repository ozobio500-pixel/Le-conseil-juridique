{% extends 'core/base.html' %}

{% block title %}Modifier un RDV - Le Conseil Juridique{% endblock %}

{% block content %}
    <div class="header">
        <h1>Modifier le rendez-vous</h1>
        <a href="{% url 'agenda' %}" style="color: #6B1D2F; text-decoration: none;">← Retour à l'agenda</a>
    </div>

    <div class="card" style="width: 100%; max-width: 600px;">
        <form method="POST">
            {% csrf_token %}
            
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Type de rendez-vous *</label>
                <select name="type_rdv" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                    <option value="CONSULTATION" {% if rdv.type_rdv == 'CONSULTATION' %}selected{% endif %}>Consultation</option>
                    <option value="AUDIENCE" {% if rdv.type_rdv == 'AUDIENCE' %}selected{% endif %}>Audience</option>
                    <option value="ECHEANCE" {% if rdv.type_rdv == 'ECHEANCE' %}selected{% endif %}>Échéance</option>
                </select>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Date et heure *</label>
                <input type="datetime-local" name="date_heure" value="{{ rdv.date_heure|date:'Y-m-d\TH:i' }}" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Objet *</label>
                <input type="text" name="objet" value="{{ rdv.objet }}" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Lieu *</label>
                <input type="text" name="lieu" value="{{ rdv.lieu }}" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
            </div>

            <button type="submit" style="background-color: #6B1D2F; color: white; padding: 12px 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%;">
                Enregistrer les modifications
            </button>
        </form>
    </div>
{% endblock %}
